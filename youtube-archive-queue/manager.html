<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archive Queue Manager</title>
    <link rel="stylesheet" href="manager.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">YouTube Archive Queue</p>
        <h1>キュー管理</h1>
      </div>
      <nav class="header-actions">
        <button type="button" id="export-button">バックアップ</button>
        <button type="button" id="import-button">復元</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </nav>
    </header>
    <aside id="update-banner" class="update-banner" hidden>
      <span id="update-message"></span>
      <a id="update-link" href="https://github.com/piniki-dev/youtube-archive-queue/releases/latest" target="_blank" rel="noreferrer">最新版を開く</a>
      <button type="button" id="update-dismiss" aria-label="更新のお知らせを閉じる">×</button>
    </aside>
    <main id="app" aria-live="polite"></main>
    <div id="toast" role="status"></div>
    <script src="manager.js"></script>
  </body>
</html>
